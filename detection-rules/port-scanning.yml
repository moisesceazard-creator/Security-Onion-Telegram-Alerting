name: Medium - Network Reconnaissance and Port Scanning (Zeek Threshold)
type: cardinality
index: ".ds-logs-zeek-so-*"
use_strftime_index: false
timestamp_field: "@timestamp"
timestamp_type: "iso"
buffer_time:
  minutes: 5
cardinality_field: "destination.port"
max_cardinality: 20
timeframe:
  minutes: 5
query_key: "source.ip"
filter:
  - term:
      event.dataset: "zeek.conn"
  - query:
      query_string:
        query: 'NOT destination.ip:224.0.0.0\/4 AND NOT destination.ip:"192.168.93.255" AND NOT destination.ip:"255.255.255.255" AND NOT source.ip:"192.168.92.50" AND NOT source.ip:"192.168.92.138" AND NOT source.ip:"192.168.92.186" AND NOT source.ip:"192.168.1.15" AND NOT service:"spicy_tailscale"'
match_enhancements:
  - "rules.ph_time.PHTimeEnhancement"
alert:
  - telegram
  - indexer
telegram_msg_title: "🟡 MEDIUM - Network Reconnaissance"
alert_text: |
  🚨 Port Scan / Reconnaissance Activity Detected!
  📌 ATT&CK: T1046 - Network Service Discovery
  🖥️ Source: {0}
  🎯 Target: {1}
  📊 Distinct destination ports touched (5 min window): threshold exceeded (>20)
  🕐 Time (PH Time): {2}
  ⚡ Action: Review source IP, confirm if authorized (e.g. pentest/audit), monitor for follow-on activity
  📣 Notify: MIS IT/Network Staff
alert_text_type: alert_text_only
alert_text_args:
  - source.ip
  - destination.ip
  - time_ph
# NOTE: indexer_connection (es_host/es_username/es_password) intentionally omitted here.
# This rule relies on the global elastalert connection settings defined in
# /opt/so/saltstack/local/pillar/elastalert/soc_elastalert.sls on the manager,
# which is NOT committed to this repo. See docs/TELEGRAM_SETUP.md.
indexer_alert_config:
  rule.name: "Network Reconnaissance and Port Scanning Activity"
  rule.uuid: "e5a1c2e0-0001-4a1a-9c1a-a00000000004"
  rule.category: "discovery"
  rule.product: "security_onion"
  event.module: "elastalert"
  event.dataset: "elastalert.alert"
  event.severity: 2
  event.severity_label: "medium"
  sigma_level: "medium"
  tags: "detection"
  source.ip: "source.ip"
  destination.ip: "destination.ip"
realert:
  minutes: 5
