name: High - Unauthorized USB or Removable Media Activity
type: any
index: ".ds-logs-windows.powershell-default-*"
use_strftime_index: false
timestamp_field: "@timestamp"
timestamp_type: "iso"
buffer_time:
  minutes: 5
filter:
  - query:
      query_string:
        query: 'process.command_line:*UNAUTHORIZED_USB_STORAGE_CONFIRMED*'
match_enhancements:
  - "rules.ph_time.PHTimeEnhancement"
alert:
  - telegram
  - indexer
telegram_msg_title: "🟠 HIGH - USB / Removable Media Activity"
alert_text: |
  🚨 Unauthorized USB Device Activity Detected!
  📌 ATT&CK: T1052.001 - Exfiltration Over Physical Medium: USB
  🖥️ Hostname: {0}
  🕐 Time (PH Time): {1}
  ⚡ Action: Verify device is authorized, check with endpoint user, review file activity
  📣 Notify: MIS IT/Network Staff
alert_text_type: alert_text_only
alert_text_args:
  - agent.name
  - time_ph
indexer_alert_config:
  rule.name: "Unauthorized Removable Media Activity and Data Exfiltration"
  rule.uuid: "e5a1c2e0-0001-4a1a-9c1a-a00000000005"
  rule.category: "exfiltration"
  rule.product: "security_onion"
  event.module: "elastalert"
  event.dataset: "elastalert.alert"
  event.severity: 3
  event.severity_label: "high"
  sigma_level: "high"
  tags: "detection"
  agent.name: "agent.name"
realert:
  minutes: 1
